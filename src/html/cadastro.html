<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/adm.css">
  <link rel="stylesheet" href="../css/cadastro.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <title>Cadastro</title>
</head>
<body>
  <div class="menuA">
    <nav>
      <a href="adm.html"><i class="fas fa-user-cog"></i></a>
    </nav>
  </div>
  <section class="profile-section">
    <div class="profile-picture">
      <img src="../../pictures/profile.png" alt="Foto do Administrador">
      <h2 class="profile-name">Administrador</h2>
    </div>
  </section>
  <section class="register-section">
    <form id="registerForm" class="register-form">
      <label for="name">Nome:</label>
      <input type="text" id="name" name="name" required>
      <label for="login">Login:</label>
      <input type="text" id="login" name="login" required>
      <label for="password">Senha:</label>
      <div class="input-container">
        <i class="far fa-eye-slash" id="togglePassword"></i>
        <input type="password" id="password" name="password" required>
      </div>
      <label for="role">Cargo:</label>
      <input type="text" id="role" name="role" required>
      <input type="submit" value="Cadastrar">
      <!--<button id="clearLocalStorage">Limpar LocalStorage</button>-->
    </form>
    <div id="notification" class="notification">Membro cadastrado com sucesso!</div>
  </section>
  <script src="../js/cadastro.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', function(event) {
      event.preventDefault(); 
      window.location.href = 'adm.html';
    });
  </script>
  
  <!--<script>
    document.getElementById('clearLocalStorage').addEventListener('click', function() {
      localStorage.clear();
      alert('LocalStorage limpo com sucesso!');
    });
  </script>-->
</body>
</html>
