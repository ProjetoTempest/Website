<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./css/login.css">
</head>
<body>
    <section>
        <div class="form-box">
            <div class="form-value">
                <form action="">
                    <img src="pictures/Sem-Título-1-removebg-preview.png" alt="">
                    <h2>Login</h2>
                    <div class="input-box">
                        <ion-icon name="mail-outline"></ion-icon>
                        <input type="email" name="" id="email" required>
                        <label for="">Email</label>
                    </div>
                    <div class="input-box">
                        <ion-icon name="eye-off-outline" id="togglePassword"></ion-icon>
                        <input type="password" name="" id="senha" required>
                        <label for="">Senha</label>
                    </div>
                    <button id="loginButton">Login</button>
                </form>
            </div>
        </div>
    </section>
    
    <script>
        const togglePassword = document.getElementById('togglePassword');
        const loginButton = document.getElementById('loginButton');
        const passwordInput = document.getElementById('senha');
        const emailInput = document.getElementById('email');

        togglePassword.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                togglePassword.name = 'eye-outline';
            } else {
                passwordInput.type = 'password';
                togglePassword.name = 'eye-off-outline';
            }
        });

        loginButton.addEventListener('click', () => {
            if (emailInput.value === '' || passwordInput.value === '') {
                console.log('Preencha todos os campos');
            } else {
                console.log('Usuário clicou no botão de login!');
            }
        });

    </script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
