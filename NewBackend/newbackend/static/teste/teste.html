<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Product</title>
</head>
<body>
    <h1>Create Product</h1>
    <form id="productForm">
        <label for="title">Title:</label>
        <input type="text" id="title" name="title"><br><br>

        <label for="description">Description:</label>
        <input type="text" id="description" name="description"><br><br>

        <label for="value">Value:</label>
        <input type="number" id="value" name="value"><br><br>

        <label for="imageFiles">Upload Images:</label>
        <input type="file" id="imageFiles" name="images" multiple><br><br>

        <button type="button" id="createProductButton">Create Product</button>
    </form>

    <script src="teste.js"></script>
</body>
</html>
